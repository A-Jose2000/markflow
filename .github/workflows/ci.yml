name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
            webview/package-lock.json

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - run: npm ci
      - run: npm ci --prefix webview
      - run: npm ci --prefix desktop
      - run: pnpm --dir mobile install --frozen-lockfile
      - run: npm run check
